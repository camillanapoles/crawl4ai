# Gradle properties for Crawl4AI Android

# Build performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Compose metrics (enable during development for performance tuning)
# android.enableComposeCompilerMetrics=true
# android.enableComposeCompilerReports=true

# Chaquopy — suppress pip warnings during build
chaquopy.pip.quiet=true
