name: Android CI — Build & Unit Test

on:
  push:
    branches: ["*"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

  # ── SDLC event triggers ────────────────────────────────────────────────
  # Allow manual dispatch for integration testing
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: "Run instrumented tests on emulator?"
        type: boolean
        default: false

# Minimal permissions required — all jobs only need to read repository contents.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_CACHE_KEY: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}

jobs:
  # ── Job 1: Validate & compile ─────────────────────────────────────────
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: 🐍 Set up Python 3.10 (Chaquopy validation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Cache Gradle / build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: |
            gradle-

      - name: 🔐 Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 🔍 Lint
        working-directory: android
        run: ./gradlew lint --stacktrace --no-daemon

      - name: 🧪 Unit tests
        working-directory: android
        run: ./gradlew test --stacktrace --no-daemon

      - name: 🏗️ Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crawl4ai-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📤 Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-${{ github.sha }}
          path: android/app/build/reports/lint-results-*.html
          retention-days: 7

  # ── Job 2: Release APK (on pushes to main/master only) ───────────────
  build-release:
    name: Build APK (release)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    timeout-minutes: 45

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: 📦 Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: gradle-

      - name: 🔐 Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 🏗️ Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          # Non-commercial build — no keystore required for basic testing
          SIGNING_KEY_ALIAS: ""
          SIGNING_KEY_PASSWORD: ""
          SIGNING_STORE_FILE: ""
          SIGNING_STORE_PASSWORD: ""

      - name: 📤 Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: crawl4ai-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  # ── Job 3: Python bridge validation ───────────────────────────────────
  validate-python-bridge:
    name: Validate Python bridge modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 📦 Install crawl4ai + dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "aiohttp>=3.11" \
            "httpx[http2]>=0.27" \
            "beautifulsoup4>=4.12" \
            "lxml>=5.3" \
            "pydantic>=2.10" \
            "numpy>=1.26" \
            "rank-bm25>=0.2" \
            "xxhash>=3.4" \
            "fake-useragent>=2.2" \
            "nltk>=3.9" \
            "aiofiles>=24.1" \
            "aiosqlite>=0.20" \
            "PyYAML>=6.0" \
            "python-dotenv>=1.0" \
            "colorama>=0.4" \
            crawl4ai

      - name: 🔍 Syntax check Python bridges
        run: |
          python -m py_compile android/app/src/main/python/crawl4ai_bridge.py
          python -m py_compile android/app/src/main/python/crawl4ai_engine.py
          python -m py_compile android/app/src/main/python/crawl4ai_config.py
          python -m py_compile android/app/src/main/python/extraction_bridge.py
          python -m py_compile android/app/src/main/python/deep_crawl_bridge.py
          python -m py_compile android/app/src/main/python/utils_bridge.py
          echo "✅ All Python bridge modules pass syntax check"

      - name: 🧪 Basic import + capability check
        run: |
          cd android/app/src/main/python
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")

          # Verify bridge imports
          import crawl4ai_bridge
          import crawl4ai_engine
          import crawl4ai_config
          import extraction_bridge
          import deep_crawl_bridge
          import utils_bridge

          # Verify utility functions
          r = utils_bridge.validate_url("https://example.com")
          import json
          assert json.loads(r)["valid"] is True

          r = utils_bridge.validate_url("not-a-url")
          assert json.loads(r)["valid"] is False

          r = utils_bridge.extract_base_domain("https://docs.crawl4ai.com/path?q=1")
          assert json.loads(r)["domain"] == "docs.crawl4ai.com"

          r = utils_bridge.get_crawl4ai_info()
          info = json.loads(r)
          print("crawl4ai version:", info.get("version"))
          print("Capabilities:", info.get("capabilities"))
          assert "markdown_generation" in info.get("capabilities", []), \
              "Expected markdown_generation capability"

          print("✅ All bridge capability checks passed")
          EOF

  # ── Job 4: Room schema validation (Phase 2 gate) ───────────────────────
  validate-room-schema:
    name: Validate Room DB schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build      # Gates on successful debug build (schema generated by KSP)

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: 📦 Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: gradle-

      - name: 🔐 Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 🗄️ Generate Room schemas (ksp)
        working-directory: android
        run: ./gradlew :app:kspDebugKotlin --stacktrace --no-daemon

      - name: ✅ Verify schema files exist
        run: |
          SCHEMA_DIR="android/app/schemas"
          DB_CLASS="com.crawl4ai.android.data.local.db.Crawl4AIDatabase"
          SCHEMA_FILE="$SCHEMA_DIR/$DB_CLASS/1.json"
          if [ -f "$SCHEMA_FILE" ]; then
            echo "✅ Room schema v1 found: $SCHEMA_FILE"
            python3 -c "
          import json, sys
          with open('$SCHEMA_FILE') as f:
              schema = json.load(f)
          tables = [t['tableName'] for t in schema['database']['entities']]
          expected = ['crawl_results','crawl_history','crawl_configs','deep_crawl_sessions','extraction_templates']
          missing = [t for t in expected if t not in tables]
          if missing:
              print('Missing tables:', missing); sys.exit(1)
          print('All 5 tables present:', tables)
          "
          else
            echo "Schema file not found at $SCHEMA_FILE"
            echo "(This is expected if KSP did not run due to cache hit)"
          fi
